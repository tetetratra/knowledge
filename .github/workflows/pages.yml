name: Knowledgeを公開

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: PagesのURLを取得
        id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
      - name: 原稿を検証
        run: python3 scripts/validate.py
      - name: 埋め込みモデルをキャッシュ
        uses: actions/cache@v4
        with:
          path: work/embedding-model
          key: static-embedding-japanese-95b3d9c80a7ccf604e2b5daee7b1b3eed6b1a9d3
      - name: サイトと検索インデックスを生成
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - name: 検索と生成サイトを検証
        run: npm test
      - name: 計算時間を記録
        run: cat dist/build-stats.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pagesに公開
        id: deployment
        uses: actions/deploy-pages@v5
